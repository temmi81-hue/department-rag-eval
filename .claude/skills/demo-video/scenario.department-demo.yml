# 약 60초 본편 + 10초 채팅용 GIF 설정
url: http://localhost:3001
output: out/department-workflow-demo.mp4
gif:
  enabled: true
  output: out/department-workflow-chat.gif
  duration: 10
  fps: 10
  scale: 960:-1

chapters:
  # 오프닝 카드 및 로그인 장면(현재 데모에는 인증 화면이 없어 진입 장면으로 표현)
  - title: 업무 지침 네비게이터
    subtitle: 복잡한 업무 절차와 협업부서를 한 번에 확인하세요
    steps:
      - wait: 1800
        caption: 업무 지침 네비게이터에 로그인합니다
      - move:
          selector: '#question'
      - wait: 1200

  - title: 1. 업무 상황 검색
    subtitle: 질문을 입력하면 관련 절차와 담당부서를 찾아드립니다
    steps:
      - highlight:
          selector: '#question'
          duration: 1200
          caption: 업무 상황을 입력합니다
      - type:
          selector: '#question'
          text: 5억 원 이상 설비 투자를 검토할 때 사전에 협의해야 할 부서와 절차를 알려주세요.
          delay: 55
      - click:
          selector: 'button:has-text("부서 찾기")'
          caption: 부서 찾기를 눌러 검색합니다
      - wait: 3500

  - title: 2. 결과 확인
    subtitle: 지침 근거와 주관·협업 부서를 확인합니다
    steps:
      - highlight:
          selector: '.workflow:first-of-type'
          duration: 1600
          caption: 추천 부서와 적용 절차를 확인합니다
      - wait: 2200
      - highlight:
          selector: '.draft-button'
          duration: 1200
          caption: 협업 요청을 저장할 준비를 합니다
      - click:
          selector: '.draft-button'
          caption: 검토 요청 내용 준비를 클릭합니다
      - wait: 1000
      - click:
          selector: '.confirmation-actions button:not(.secondary)'
          caption: 요청 내용을 확인하고 저장합니다
      - wait: 1700

  - title: 3. 협업 요청 및 상태 확인
    subtitle: 이메일을 보내고 현업 확인 상태까지 관리합니다
    steps:
      - highlight:
          selector: '.draft textarea[aria-label="검토 요청 초안"]'
          duration: 1300
          caption: 담당부서와 요청사항이 자동으로 정리됩니다
      - click:
          selector: '.send-button'
          caption: 이메일을 전송해 검토를 요청합니다
      - wait: 2500
      - highlight:
          selector: '.request-tracker'
          duration: 1200
          caption: 담당부서 접수 상태를 확인합니다
      - click:
          selector: '.reply-tab'
          caption: 담당부서 접수 확인 · 검토 중으로 변경합니다
      - wait: 1300
      - click:
          selector: '.reply-tab'
          caption: 현업 담당자 확인 후 회신 완료로 변경합니다
      - wait: 1800

  # 엔딩 카드
  - title: 업무 요청 완료
    subtitle: 근거 확인부터 이메일 요청과 회신 상태까지 한 흐름으로 관리
    steps:
      - wait: 2200
