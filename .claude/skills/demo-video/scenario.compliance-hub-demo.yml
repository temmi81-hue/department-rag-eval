# 약 60초 본편 데모 — Compliance Hub까지 포함 (결과보고서 첨부용)
# 오프닝 카드 + 챕터 4개(검색/결과확인/메일전송/진행현황) + 엔딩 카드(Compliance Hub)
url: http://localhost:3100
output: out/department-workflow-demo-compliance-hub.mp4

chapters:
  # 오프닝 카드
  - title: 업무 지침 네비게이터
    subtitle: 업무 상황을 입력하면 절차와 협업부서를 안내하고 이메일로 요청까지 이어집니다
    steps:
      - wait: 1800
        caption: 업무 지침 네비게이터에 접속합니다
      - move:
          selector: '#question'
      - wait: 700

  - title: 1. 업무 상황 검색
    subtitle: 질문을 입력하면 관련 절차와 담당부서를 찾아드립니다
    steps:
      - highlight:
          selector: '#question'
          duration: 900
          caption: 업무 상황을 입력합니다
      - type:
          selector: '#question'
          text: 5억 원 이상 설비 투자를 검토할 때 사전에 협의해야 할 부서와 절차를 알려주세요.
          delay: 50
      - click:
          selector: 'button:has-text("부서 찾기")'
          caption: 부서 찾기를 눌러 검색합니다
      - wait: 1500

  - title: 2. 결과 확인 및 부서 선택
    subtitle: RAG 근거로 추천 부서를 확인하고 협업 요청 대상을 고릅니다
    steps:
      - highlight:
          selector: '.rag-panel'
          duration: 1100
          caption: 추천 부서와 협업 부서를 확인합니다
      - wait: 500
      - scroll:
          selector: '.result-grid'
          duration: 800
          caption: 비교용 추천 결과로 이동합니다
      - click:
          selector: 'article.department-card:has-text("투자관리그룹") input[type="checkbox"]'
          caption: 투자관리그룹을 협업 부서로 선택합니다
      - click:
          selector: 'article.department-card:has-text("설비자재구매그룹") input[type="checkbox"]'
          caption: 설비자재구매그룹도 추가로 선택합니다
      - click:
          selector: '.draft-button'
          caption: 검토 요청 내용 준비를 클릭합니다
      - wait: 700
      - click:
          selector: '.confirmation-actions button:not(.secondary)'
          caption: 요청 내용을 확인하고 저장합니다
      - wait: 900

  - title: 3. 협업 요청 메일 전송
    subtitle: 자동 정리된 요청 사항을 담당부서에 전송합니다
    steps:
      - scroll:
          selector: '.draft'
          duration: 900
          caption: 메일 초안 화면으로 이동합니다
      - expand:
          selector: '.draft textarea[aria-label="검토 요청 초안"]'
      - highlight:
          selector: '.draft textarea[aria-label="검토 요청 초안"]'
          duration: 1600
          caption: 요청 사항이 자동으로 정리됩니다
      - scroll:
          selector: '.send-button'
          duration: 700
      - click:
          selector: '.send-button'
          caption: 메일 보내기를 눌러 검토를 요청합니다
      - wait: 1800

  - title: 4. 협업 진행 현황 관리
    subtitle: 메일 발송부터 회신 완료까지 진행 상태를 한 화면에서 확인합니다
    steps:
      - scroll:
          selector: '.request-tracker'
          duration: 900
      - highlight:
          selector: '.request-tracker'
          duration: 1200
          caption: 업무 요청 완료 현황을 확인합니다
      - click:
          selector: '.reply-tab'
          caption: 담당부서 접수 확인 · 검토중으로 변경합니다
      - wait: 1000
      - click:
          selector: '.reply-tab'
          caption: 현업 담당자 확인 후 회신 완료로 변경합니다
      - wait: 1300

  # 엔딩 카드
  - title: Compliance Hub
    subtitle: 참고 문서와 협업 요청 이력을 한 곳에서 관리합니다
    steps:
      - click:
          selector: 'nav.nav-links a:has-text("Compliance Hub")'
          caption: Compliance Hub로 이동합니다
      - wait: 800
      - scroll:
          selector: '.document-list'
          duration: 800
          caption: 참고 문서 목록을 확인합니다
      - highlight:
          selector: '.document-list'
          duration: 900
      - scroll:
          selector: '.request-log'
          duration: 800
          caption: 협업 요청 이력을 확인합니다
      - highlight:
          selector: '.request-log'
          duration: 1400
      - wait: 1000
